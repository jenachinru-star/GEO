services:
  backend:
    build: ./backend
    container_name: geo-backend
    env_file: ./backend/.env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./backend/data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: geo-frontend
    ports:
      - "8028:80"
    depends_on:
      - backend
    restart: unless-stopped
