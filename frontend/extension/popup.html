<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #333;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e8e8e8;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: #1677ff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      margin-right: 10px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
      display: block;
    }
    .input, .select, .textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .input:focus, .select:focus, .textarea:focus {
      border-color: #1677ff;
    }
    .textarea {
      resize: vertical;
      min-height: 60px;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .row .form-group {
      flex: 1;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #1677ff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover { background: #4096ff; }
    .btn:disabled { background: #94bfff; cursor: not-allowed; }
    .btn-secondary {
      background: #f5f5f5;
      color: #333;
      border: 1px solid #d9d9d9;
    }
    .btn-secondary:hover { background: #e8e8e8; }
    .status {
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    .status.success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block; }
    .status.error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block; }
    .status.loading { background: #e6f4ff; color: #1677ff; border: 1px solid #91caff; display: block; }
    .page-info {
      background: #f9f9f9;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .page-info .url {
      color: #999;
      word-break: break-all;
      margin-top: 4px;
    }
    .api-config {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e8e8e8;
    }
    .api-config h4 {
      font-size: 13px;
      margin-bottom: 8px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">G</div>
    <div class="title">数字资产收藏</div>
  </div>

  <div class="page-info" id="pageInfo">
    <div>正在读取页面信息...</div>
  </div>

  <div class="form-group">
    <label class="label">标题</label>
    <input type="text" class="input" id="title" placeholder="页面标题">
  </div>

  <div class="row">
    <div class="form-group">
      <label class="label">分类</label>
      <select class="select" id="category">
        <option value="medicine">医学文献</option>
        <option value="business">行业资讯</option>
        <option value="personal">个人笔记</option>
        <option value="other">其他</option>
      </select>
    </div>
    <div class="form-group">
      <label class="label">AI总结</label>
      <select class="select" id="autoSummary">
        <option value="1">开启</option>
        <option value="0">关闭</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label class="label">标签（用逗号分隔）</label>
    <input type="text" class="input" id="tags" placeholder="如: 高血压, 心血管">
  </div>

  <div class="form-group">
    <label class="label">备注</label>
    <textarea class="textarea" id="remark" placeholder="添加您的备注..."></textarea>
  </div>

  <button class="btn" id="saveBtn">收藏到数字资产库</button>
  <button class="btn btn-secondary" id="openBtn">打开GEO系统</button>

  <div class="status" id="status"></div>

  <div class="api-config">
    <h4>API配置</h4>
    <div class="form-group">
      <input type="text" class="input" id="apiBase" placeholder="API地址 (如: http://10.16.190.100:8028/geo/api/v1)">
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
